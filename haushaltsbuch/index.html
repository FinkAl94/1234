<body><title>Haushaltsbuch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<style>
@font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 200 800; font-display: swap; src: url(fonts/bricolage-grotesque.woff2) format("woff2"); }
@font-face { font-family: "Figtree"; font-style: normal; font-weight: 300 900; font-display: swap; src: url(fonts/figtree.woff2) format("woff2"); }
/* Layout: one-column phone app — header with period control, scrolling main, bottom tab bar with a central + button. */
:root {
  --bg: #eef1ef;
  --surface: #ffffff;
  --surface-2: #f4f7f5;
  --ink: #142320;
  --ink-2: #4a5955;
  --muted: #7d8985;
  --line: #dbe2de;
  --accent: #0d6e5f;
  --accent-ink: #ffffff;
  --accent-soft: #d7ebe6;
  --pos: #11703a;
  --neg: #b3361e;
  --danger: #c0392b;
  --in: #2a78d6;
  --out: #eb6834;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --shadow: 0 10px 30px rgba(20, 35, 32, .14);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1413; --surface: #172020; --surface-2: #1e2827; --ink: #e7eeeb; --ink-2: #b1beb9;
    --muted: #84918d; --line: #2a3533; --accent: #4cc1aa; --accent-ink: #062019; --accent-soft: #163a33;
    --pos: #3fcf75; --neg: #f07a62; --danger: #ef6f60; --in: #3987e5; --out: #d95926;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #172020; --surface-2: #1e2827; --ink: #e7eeeb; --ink-2: #b1beb9;
  --muted: #84918d; --line: #2a3533; --accent: #4cc1aa; --accent-ink: #062019; --accent-soft: #163a33;
  --pos: #3fcf75; --neg: #f07a62; --danger: #ef6f60; --in: #3987e5; --out: #d95926;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; background: var(--bg); }
*, *::before, *::after { box-sizing: border-box; }
body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { height: 100%; max-width: 560px; margin: 0 auto; display: grid; grid-template-rows: auto 1fr auto; padding-inline: 16px; position: relative; }

/* Header */
.top { padding-block: 14px 10px; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; letter-spacing: -.02em; }
.store-pill { font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.store-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.store-pill.db i { background: var(--pos); }
.store-pill.local i { background: var(--c4); }
.period { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.period-nav { display: flex; align-items: center; gap: 2px; flex: 1 1 auto; min-width: 0; }
.period-nav strong { flex: 1; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.icon-btn svg { width: 20px; height: 20px; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg label, .seg button { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span, .seg button { display: block; padding: 6px 12px; border-radius: 8px; font-size: .86rem; font-weight: 600; color: var(--ink-2); cursor: pointer; border: 0; background: transparent; white-space: nowrap; }
.seg input:checked + span, .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }

/* Main */
main { overflow-y: auto; overflow-x: hidden; padding-block: 4px 24px; display: grid; align-content: start; gap: 14px; min-width: 0; margin-inline: -16px; padding-inline: 16px; }
.card { background: var(--surface); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.lbl { font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.sums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sum.total { grid-column: 1 / -1; grid-template-columns: auto 1fr; align-items: baseline; gap: 12px; }
.sum.total b { font-size: 1.45rem; text-align: right; }
.sum { background: var(--surface); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.sum .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .03em; font-size: .68rem; }
.sum b { font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.sum.in b { color: var(--ink); }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.tile b { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile small { color: var(--ink-2); font-size: .8rem; }
.swatch-key { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; }

.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.notice { background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: .88rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.notice button { border: 0; background: transparent; color: var(--accent); font-weight: 700; cursor: pointer; padding: 4px 0; }
.notice.warn { background: color-mix(in srgb, var(--c4) 18%, var(--surface)); }

.day { display: grid; gap: 2px; }
.day-head { display: flex; justify-content: space-between; padding: 8px 4px 4px; font-size: .8rem; color: var(--ink-2); font-weight: 600; }
.rows { background: var(--surface); border-radius: 14px; overflow: hidden; }
.row { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border: 0; background: transparent; text-align: left; cursor: pointer; }
.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: var(--surface-2); }
.cat-dot { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: .9rem; color: #fff; }
.row-main { min-width: 0; }
.row-main b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-main small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .82rem; }
.tag { font-size: .68rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.in { color: var(--pos); }

.empty { text-align: center; padding: 34px 18px; color: var(--ink-2); display: grid; gap: 8px; justify-items: center; }
.empty strong { font-family: var(--font-display); font-size: 1.1rem; color: var(--ink); }
.empty p { margin: 0; max-width: 34ch; }

/* Charts */
.chart-wrap { position: relative; min-width: 0; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-wrap svg text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.donut-box { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 16px; align-items: center; }
@media (max-width: 420px) { .donut-box { grid-template-columns: 1fr; justify-items: center; } .donut-box .legend { width: 100%; } }
.donut { width: 100%; max-width: 220px; position: relative; aspect-ratio: 1; }
.donut svg { width: 100%; height: 100%; display: block; }
.donut path, .donut circle.slice { cursor: pointer; transition: opacity .15s; }
.donut.has-sel .slice:not(.sel) { opacity: .35; }
.donut-center { position: absolute; inset: 22%; display: grid; place-content: center; text-align: center; pointer-events: none; gap: 1px; }
.donut-center small { color: var(--ink-2); font-size: .76rem; line-height: 1.2; max-width: 12ch; margin: 0 auto; overflow: hidden; text-overflow: ellipsis; }
.donut-center b { font-family: var(--font-display); font-size: 1.08rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.donut-center em { font-style: normal; color: var(--muted); font-size: .76rem; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; min-width: 0; }
.legend li button { width: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 6px; border-radius: 8px; border: 0; background: transparent; text-align: left; cursor: pointer; font-size: .88rem; }
.legend li button:hover, .legend li button.sel { background: var(--surface-2); }
.legend .sw { width: 12px; height: 12px; border-radius: 4px; }
.legend .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend .pc { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .8rem; min-width: 3.4em; text-align: right; }
.legend .vl { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.bar-legend { display: flex; gap: 14px; font-size: .84rem; color: var(--ink-2); }
.tip { position: absolute; z-index: 3; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: .8rem; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow); transform: translate(-50%, -100%); display: grid; gap: 1px; }
.tip b { font-weight: 700; }
.tip span { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
details.table summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: .88rem; }
.tbl-wrap { overflow-x: auto; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }

/* Categories */
.cat-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; }
.cat-row + .cat-row { border-top: 1px solid var(--line); }
.cat-row:hover { background: var(--surface-2); }
.cat-row .cat-dot { width: 30px; height: 30px; border-radius: 9px; font-size: .8rem; }
.cat-row small { color: var(--muted); font-size: .82rem; }
.add-link { border: 1px dashed var(--line); background: transparent; color: var(--accent); font-weight: 700; border-radius: 12px; padding: 10px; cursor: pointer; }

/* Buttons & forms */
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btn.danger-ghost { background: transparent; color: var(--danger); }
.btn.danger { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 18px; height: 18px; }
.stack { display: grid; gap: 10px; }
.field { display: grid; gap: 6px; }
.field input[type="text"], .field input[type="date"], .field input:not([type]), textarea { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; min-width: 0; }
.amount-wrap { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.amount-wrap:focus-within { border-color: var(--accent); }
.field .amount-wrap input { flex: 1; min-width: 0; border: 0; background: transparent; font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; padding: 0; font-variant-numeric: tabular-nums; outline: none; }
.amount-wrap span { font-family: var(--font-display); font-size: 1.6rem; color: var(--muted); font-weight: 700; }
.err { color: var(--danger); font-size: .85rem; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); font-size: .88rem; font-weight: 500; cursor: pointer; background: var(--surface); }
.chip span i { width: 9px; height: 9px; border-radius: 50%; }
.chip input:checked + span { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; color: var(--ink-2); cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.actions { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding-top: 4px; }
.actions .btn.primary { flex: 1; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches label { position: relative; }
.swatches input { position: absolute; opacity: 0; }
.swatches span { display: block; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; border: 3px solid transparent; }
.swatches input:checked + span { border-color: var(--ink); }
.swatches input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Bottom nav */
.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding-block: 6px 8px; border-top: 1px solid var(--line); background: var(--bg); margin-inline: -16px; padding-inline: 8px; }
.tab { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; font-size: .7rem; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 10px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.fab { justify-self: center; width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); margin-top: -18px; }
.fab svg { width: 26px; height: 26px; }

/* Sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8, 16, 14, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; animation: up .22s ease-out; }
@media (min-width: 600px) { .overlay { align-items: center; } .sheet { border-radius: 20px; } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; }
.sheet p { margin: 0; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .9rem; z-index: 30; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast.error { background: var(--danger); color: #fff; }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
textarea { font-family: ui-monospace, Menlo, monospace; font-size: .75rem; height: 160px; resize: vertical; }

/* Difference card */
.diff { gap: 10px; }
.diff-num { font-family: var(--font-display); font-weight: 800; font-size: 2.3rem; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.diff-text { margin: 0; color: var(--ink-2); font-size: .92rem; }
.cmp { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; font-size: .86rem; }
.cmp .track { height: 12px; background: var(--surface-2); border-radius: 0 6px 6px 0; overflow: hidden; }
.cmp .track i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.cmp .v { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.diff-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .84rem; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 10px; }
.sums-note { margin: -6px 2px 0; font-size: .82rem; color: var(--ink-2); }

/* Recurring */
.planned .row { cursor: pointer; }
.planned .cat-dot { background: transparent !important; border: 2px dashed var(--line); color: var(--muted); }
.planned .amt { color: var(--muted); }
.rec-ico { display: inline-block; width: 13px; height: 13px; vertical-align: -1px; margin-left: 5px; color: var(--muted); }
.info { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .88rem; color: var(--ink-2); display: grid; gap: 6px; }
.info button { justify-self: start; border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 0; cursor: pointer; }
.hint { font-size: .84rem; color: var(--ink-2); margin: 0; }
.field input[type="number"], .field input[type="month"], .field input[type="password"] { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.store-pill.offline i { background: var(--danger); }

/* Keyword rules */
.kw-group { display: grid; gap: 6px; padding-block: 8px; border-top: 1px solid var(--line); }
.kw-group:first-of-type { border-top: 0; }
.kw-group > span { font-size: .84rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kw-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.kw { display: inline-flex; align-items: center; gap: 2px; padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: .82rem; }

<script>
(() => {
'use strict';

/* ---------- Constants & helpers ---------- */
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MON_SHORT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WEEKDAYS = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const DEFAULT_CATS = [
  { id: 'lebensmittel', name: 'Lebensmittel', type: 'out', slot: 0 },

  { id: 'unterricht', name: 'Unterrichtsmaterial', type: 'out', slot: 6 },
  { id: 'sonstiges-out', name: 'Sonstiges', type: 'out', slot: 7, locked: true },
  { id: 'gehalt', name: 'Gehalt', type: 'in', slot: 0 },
  { id: 'nebenverdienst', name: 'Nebenverdienst', type: 'in', slot: 1 },

  { id: 'sonstiges-in', name: 'Sonstiges', type: 'in', slot: 3, locked: true },
];
const FALLBACK = { out: 'sonstiges-out', in: 'sonstiges-in' };
// Starter keywords: a keyword only applies when its category exists and matches the booking's type.
const DEFAULT_KEYWORDS = [
  ['rewe', 'lebensmittel'], ['edeka', 'lebensmittel'], ['aldi', 'lebensmittel'], ['lidl', 'lebensmittel'], ['netto', 'lebensmittel'],
  ['penny', 'lebensmittel'], ['kaufland', 'lebensmittel'], ['bäckerei', 'lebensmittel'],
  ['miete', 'wohnen'], ['stadtwerke', 'wohnen'], ['vattenfall', 'wohnen'], ['e.on', 'wohnen'], ['telekom', 'wohnen'], ['vodafone', 'wohnen'], ['rundfunk', 'wohnen'],
  ['deutsche bahn', 'mobilitaet'], ['db vertrieb', 'mobilitaet'], ['deutschlandticket', 'mobilitaet'], ['aral', 'mobilitaet'], ['shell', 'mobilitaet'], ['esso', 'mobilitaet'], ['tankstelle', 'mobilitaet'],
  ['netflix', 'freizeit'], ['spotify', 'freizeit'], ['kino', 'freizeit'], ['restaurant', 'freizeit'],
  ['apotheke', 'gesundheit'], ['arzt', 'gesundheit'], ['optiker', 'gesundheit'],
  ['versicherung', 'versicherungen'], ['huk', 'versicherungen'], ['allianz', 'versicherungen'], ['debeka', 'versicherungen'],
  ['cornelsen', 'unterricht'], ['klett', 'unterricht'], ['westermann', 'unterricht'], ['thalia', 'unterricht'], ['laminier', 'unterricht'],
  ['bezüge', 'gehalt'], ['besoldung', 'gehalt'], ['gehalt', 'gehalt'],
  ['nachhilfe', 'nebenverdienst'], ['beihilfe', 'erstattungen'], ['erstattung', 'erstattungen'], ['finanzamt', 'erstattungen'],
  ['e-center', 'lebensmittel'], ['e center', 'lebensmittel'], ['tegut', 'lebensmittel'], ['getränke', 'lebensmittel'], ['getraenke', 'lebensmittel'],
  ['toogoodtogo', 'lebensmittel'], ['too good to go', 'lebensmittel'], ['metzgerei', 'lebensmittel'], ['baeckerei', 'lebensmittel'],
  ['drillisch', 'wohnen'], ['1&1', 'wohnen'], ['congstar', 'wohnen'], ['obi', 'wohnen'], ['hornbach', 'wohnen'], ['bauhaus', 'wohnen'], ['baumarkt', 'wohnen'],
  ['playstation', 'freizeit'], ['steam', 'freizeit'], ['golf', 'freizeit'], ['disney', 'freizeit'], ['zahnarzt', 'gesundheit'],
  ['reisekosten', 'erstattungen'],
].map(([w, cat]) => ({ w, cat }));
const LOCAL_KEY = 'haushaltsbuch.v1';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const eurFmt = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const intFmt = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });
const pctFmt = new Intl.NumberFormat('de-DE', { style: 'percent', maximumFractionDigits: 1 });
const money = c => eurFmt.format((c || 0) / 100);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const colorOf = cat => cat && cat.slot >= 0 ? `var(--c${(cat.slot % 8) + 1})` : 'var(--muted)';

function parseAmount(str) {
  let s = String(str ?? '').replace(/[\s€]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  if (!/^\d+(\.\d{0,2})?$/.test(s)) return NaN;
  return Math.round(parseFloat(s) * 100);
}
function fmtDay(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${WEEKDAYS[dt.getDay()]}, ${d}. ${MONTHS[m - 1]}${y !== new Date().getFullYear() ? ' ' + y : ''}`;
}
function daysSince(iso) { return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }

/* Recurring helpers — months as 'YYYY-MM' strings, which sort correctly as text */
const RHYTHM = { 1: 'monatlich', 3: 'vierteljährlich', 12: 'jährlich' };
const ymOf = d => d.slice(0, 7);
const ymAdd = (ym, n) => { const [y, m] = ym.split('-').map(Number); const t = y * 12 + (m - 1) + n; return `${Math.floor(t / 12)}-${pad(t % 12 + 1)}`; };
const ymDiff = (a, b) => { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); };
const occDate = (ym, day) => { const [y, m] = ym.split('-').map(Number); return `${ym}-${pad(Math.min(day, new Date(y, m, 0).getDate()))}`; };
const isOcc = (r, ym) => ym >= r.start && (!r.end || ym <= r.end) && ymDiff(r.start, ym) % r.every === 0;
function nextOcc(r) {
  let ym = r.start;
  while (r.last && ym <= r.last) ym = ymAdd(ym, r.every);
  return r.end && ym > r.end ? null : occDate(ym, r.day);
}
const rules = () => Array.isArray(S.settings.recurring) ? S.settings.recurring : [];
const ruleLabel = r => `${RHYTHM[r.every] || 'monatlich'} am ${r.day}.`;
const recIcon = '<svg class="rec-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="wiederkehrend"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>';
function fmtShort(iso) { const [y, m, d] = iso.split('-').map(Number); return `${d}. ${MON_SHORT[m - 1]}${y !== new Date().getFullYear() ? ' ' + y : ''}`; }

/* ---------- State ---------- */
const now = new Date();
const S = {
  view: 'list',
  period: { kind: 'month', y: now.getFullYear(), m: now.getMonth() },
  listFilter: 'all',
  pieType: 'out',
  entries: [],
  dbEntries: [],
  settings: {},
  loaded: false,
  lastType: 'out',
  locked: false, hiddenAt: 0,
};
S.locked = !!getLock();
try { const v = localStorage.getItem(LOCAL_KEY + '.view'); if (['list', 'stats', 'cats', 'backup'].includes(v)) S.view = v; } catch {}

const catSort = (a, b) => (!!a.locked - !!b.locked) || a.name.localeCompare(b.name, 'de', { sensitivity: 'base' });
const cats = () => (Array.isArray(S.settings.categories) && S.settings.categories.length ? S.settings.categories : DEFAULT_CATS).slice().sort(catSort);
const catMap = () => new Map(cats().map(c => [c.id, c]));
const catFor = (map, id) => map.get(id) || { id, name: 'Unbekannt', slot: -1 };
const keywords = () => Array.isArray(S.settings.keywords) ? S.settings.keywords : DEFAULT_KEYWORDS;
// Short keywords must start a word ("obi" must not match "mobilet"); long ones may sit inside compound words.
const kwRe = new Map();
function kwHit(t, w) {
  if (w.length >= 6) return t.includes(w);
  let re = kwRe.get(w);
  if (!re) { re = new RegExp('(?:^|[^a-zäöüß0-9])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')); kwRe.set(w, re); }
  return re.test(t);
}
// Finds the category whose keyword appears in the text; the longest keyword wins.
function matchKeyword(text, type) {
  const t = String(text || '').toLowerCase();
  if (!t.trim()) return null;
  const map = catMap();
  let best = null;
  for (const k of keywords()) {
    const w = String(k.w || '').toLowerCase().trim();
    const c = map.get(k.cat);
    if (!w || !c || (type && c.type !== type) || !kwHit(t, w)) continue;
    if (!best || w.length > best.w.length) best = { w, cat: k.cat };
  }
  return best;
}

/* ---------- Storage ---------- */
const store = {
  mode: 'loading', entriesCol: null, settingsRef: null, settingsChain: Promise.resolve(), downloads: null,

  // Account mode: a write that cannot reach the server (no signal, timeout) is parked in
  // the outbox in this browser and sent again once the connection is back.
  async putEntry(e) {
    if (this.mode === 'db') {
      const { id, ...body } = e;
      await this.dbWrite({ op: 'set', id, body: JSON.parse(JSON.stringify(body)) });
    } else {
      const i = S.entries.findIndex(x => x.id === e.id);
      if (i >= 0) S.entries[i] = e; else S.entries.push(e);
      saveLocal(); render();
    }
  },
  async removeEntry(id) {
    if (this.mode === 'db') await this.dbWrite({ op: 'del', id });
    else { S.entries = S.entries.filter(x => x.id !== id); saveLocal(); render(); }
  },
  async dbWrite(op) {
    if (!navigator.onLine || outbox.length) { queueOp(op); flushSoon(navigator.onLine ? 300 : 15000); return; }
    try { await sendOp(op); }
    catch (err) { if (isNetErr(err)) { queueOp(op); return; } throw err; }
  },
  putSettings(patch) {
    S.settings = { ...S.settings, ...patch };
    render();
    if (this.mode === 'db') {
      settingsDirty = true; saveOutbox();
      this.settingsChain = this.settingsChain.then(() => sendSettings()).catch(() => {});
      return this.settingsChain;
    }
    saveLocal();
    return Promise.resolve();
  },
};

/* ---------- Outbox for account mode ---------- */
const OUTBOX_KEY = LOCAL_KEY + '.outbox';
let outbox = [], settingsDirty = false, flushing = false, flushTimer = 0;
try {
  const o = JSON.parse(localStorage.getItem(OUTBOX_KEY) || 'null');
  if (o && Array.isArray(o.ops)) { outbox = o.ops; if (o.settings) { S.settings = o.settings; settingsDirty = true; } }
} catch {}
function saveOutbox() {
  try {
    if (!outbox.length && !settingsDirty) localStorage.removeItem(OUTBOX_KEY);
    else localStorage.setItem(OUTBOX_KEY, JSON.stringify({ ops: outbox, settings: settingsDirty ? S.settings : null }));
  } catch {}
}
const isNetErr = err => !err || err.code === 'unavailable' || err.code === 'timeout' || err.code === 'resource_exhausted';
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]); }
function sendOp(op) {
  const ref = store.entriesCol.doc(op.id);
  return withTimeout(op.op === 'set' ? ref.set(op.body) : ref.delete(), 8000);
}
async function sendSettings() {
  if (!settingsDirty) return;
  if (!navigator.onLine) { flushSoon(); return; }
  try {
    await withTimeout(store.settingsRef.set(JSON.parse(JSON.stringify(S.settings))), 8000);
    settingsDirty = false; saveOutbox(); render();
  } catch (err) {
    if (isNetErr(err)) flushSoon();
    else toast('Einstellungen nicht gespeichert: ' + errText(err), true);
  }
}
function queueOp(op) {
  outbox = outbox.filter(o => o.id !== op.id).concat(op);
  saveOutbox(); mergeEntries(); render();
}
function mergeEntries() {
  if (store.mode !== 'db') return;
  const m = new Map(S.dbEntries.map(e => [e.id, e]));
  for (const o of outbox) { if (o.op === 'set') m.set(o.id, { id: o.id, ...o.body }); else m.delete(o.id); }
  S.entries = [...m.values()];
}
function flushSoon(ms = 15000) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }
async function flush() {
  if (store.mode !== 'db' || flushing) return;
  if (!outbox.length && !settingsDirty) return;
  if (!navigator.onLine) { flushSoon(); return; }
  flushing = true;
  const before = outbox.length;
  try {
    await sendSettings();
    while (outbox.length) {
      const op = outbox[0];
      try { await sendOp(op); }
      catch (err) { if (isNetErr(err)) { flushSoon(); break; } toast('Eine offline erfasste Änderung wurde abgelehnt: ' + errText(err), true); }
      outbox = outbox.filter(o => o !== op); saveOutbox();
    }
    mergeEntries(); render();
    if (before && !outbox.length) toast(`${before} offline erfasste ${before === 1 ? 'Änderung' : 'Änderungen'} gespeichert.`);
  } finally { flushing = false; }
}
window.addEventListener('online', () => { render(); flush(); });
window.addEventListener('offline', render);

/* ---------- Recurring bookings ---------- */
let booking = false;
async function bookDue() {
  if (booking || !S.loaded || !rules().length) return;
  booking = true;
  try {
    const today = todayISO(), tYm = ymOf(today), add = [];
    let changed = false;
    const updated = rules().map(r => {
      let last = r.last || '';
      for (let ym = r.start; ym <= tYm && (!r.end || ym <= r.end); ym = ymAdd(ym, r.every)) {
        if (ym <= last) continue;
        const date = occDate(ym, r.day);
        if (date > today) break;
        add.push({ id: `r-${r.id}-${ym}`, type: r.type, amount: r.amount, cat: r.cat, date, party: r.party || '', note: r.note || '', tax: !!r.tax, rule: r.id, created: Date.now() });
        last = ym;
      }
      if (last !== (r.last || '')) { changed = true; return { ...r, last }; }
      return r;
    });
    if (!add.length) return;
    for (const e of add) await store.putEntry(e);
    if (changed) await store.putSettings({ recurring: updated });
    toast(`${add.length} wiederkehrende ${add.length === 1 ? 'Buchung' : 'Buchungen'} eingetragen.`);
  } catch (err) {
    toast('Wiederkehrende Buchungen nicht eingetragen: ' + errText(err), true);
  } finally { booking = false; }
}
function plannedFor(p = S.period) {
  if (p.kind !== 'month') return [];
  const [from, to] = periodRange(p), today = todayISO();
  const out = [];
  for (const ym of [ymOf(from), ymAdd(ymOf(from), 1)]) for (const r of rules()) {
    if (!isOcc(r, ym) || (r.last && ym <= r.last)) continue;
    const date = occDate(ym, r.day);
    if (date > today && date >= from && date < to) out.push({ id: 'plan-' + r.id, rule: r.id, type: r.type, amount: r.amount, cat: r.cat, date, party: r.party || '', note: r.note || '', tax: !!r.tax, planned: true });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function saveLocal() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ entries: S.entries, settings: S.settings })); }
  catch { toast('Speichern im Browser nicht möglich. Bitte Backup erstellen.', true); }
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    if (raw) { const d = JSON.parse(raw); S.entries = Array.isArray(d.entries) ? d.entries : []; S.settings = d.settings || {}; }
  } catch {}
}
function errText(err) {
  const c = err && err.code;
  if (c === 'quota_exceeded') return 'Speicher voll.';
  if (c === 'invalid_argument') return 'Keine Schreibrechte oder ungültige Daten.';
  if (c === 'resource_exhausted') return 'Zu viele Änderungen auf einmal, bitte kurz warten.';
  if (c === 'revoked') return 'Zugriff wurde beendet.';
  return 'Verbindung unterbrochen, bitte erneut versuchen.';
}
async function withRetry(fn) {
  try { return await fn(); }
  catch (err) {
    if (err && (err.code === 'unavailable' || err.code === 'resource_exhausted')) { await sleep(700 + Math.random() * 900); return await fn(); }
    throw err;
  }
}
async function bulk(tasks, onProgress) {
  const queue = tasks.slice(); let done = 0;
  const worker = async () => { while (queue.length) { const t = queue.shift(); await withRetry(t); done++; onProgress && onProgress(done, tasks.length); } };
  await Promise.all([worker(), worker(), worker()]);
}

/* ---------- Period ---------- */
// The month can start on any day 1-31 (in shorter months the last day of the month counts). Up to day 15 the
// period is named after the month it starts in, from day 16 on after the month it ends in (28 Sep - 27 Oct is "Oktober").
const periodStart = () => { const v = Math.floor(+S.settings.periodStart); return v >= 1 && v <= 31 ? v : 1; };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const boundary = (y, m) => isoDay(y, m, Math.min(periodStart(), dim(y, m)));
const mAdd = (y, m, n) => { const t = y * 12 + m + n; return [Math.floor(t / 12), ((t % 12) + 12) % 12]; };
const isoDay = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
function monthRange(y, m) {
  const s = periodStart();
  if (s <= 15) { const [ny, nm] = mAdd(y, m, 1); return [boundary(y, m), boundary(ny, nm)]; }
  const [py, pm] = mAdd(y, m, -1); return [boundary(py, pm), boundary(y, m)];
}
function periodRange(p = S.period) {
  if (p.kind === 'all') return ['0000-01-01', '9999-12-31'];
  if (p.kind === 'year') return [monthRange(p.y, 0)[0], monthRange(p.y, 11)[1]];
  return monthRange(p.y, p.m);
}
function currentLabelMonth() {
  const t = new Date(), s = periodStart(), y = t.getFullYear(), m = t.getMonth();
  if (s <= 15) return t.getDate() >= s ? [y, m] : mAdd(y, m, -1);
  return t.getDate() >= Math.min(s, dim(y, m)) ? mAdd(y, m, 1) : [y, m];
}
function anchorPeriod() { const [y, m] = currentLabelMonth(); S.period.y = y; S.period.m = m; }
function inPeriod(e, p = S.period) { const [a, b] = periodRange(p); return e.date >= a && e.date < b; }
function periodLabel(p = S.period) {
  if (p.kind === 'all') return 'Alle Buchungen';
  if (p.kind === 'year') return String(p.y);
  return `${MONTHS[p.m]} ${p.y}`;
}
function periodRangeText(p = S.period) {
  if (p.kind === 'all' || periodStart() === 1) return '';
  const [a, b] = periodRange(p);
  const end = new Date(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8) - 1);
  const fa = `${a.slice(8)}.${a.slice(5, 7)}.`, fb = `${pad(end.getDate())}.${pad(end.getMonth() + 1)}.${end.getFullYear()}`;
  return p.kind === 'month' ? `${fa} – ${fb}` : `${fa}${a.slice(0, 4)} – ${fb}`;
}
function shiftPeriod(d) {
  const p = S.period; S.touched = true;
  if (p.kind === 'month') { p.m += d; if (p.m < 0) { p.m = 11; p.y--; } if (p.m > 11) { p.m = 0; p.y++; } }
  else if (p.kind === 'year') p.y += d;
  render();
}
function totals(list) {
  let i = 0, o = 0;
  for (const e of list) { if (e.type === 'in') i += e.amount; else o += e.amount; }
  return { i, o, s: i - o };
}

/* ---------- Render ---------- */
let raf = 0;
function render() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; draw(); }); }

function draw() {
  $('.tabbar').hidden = S.locked;
  if (S.locked) {

    : store.mode === 'db' ? 'In deinem Konto' : store.mode === 'local' ? 'Nur dieses Gerät' : 'Lädt …';
  pill.title = waiting ? 'Diese Änderungen sind in diesem Browser zwischengespeichert und werden gesendet, sobald du wieder online bist.' : '';

/* ---------- Statistics ---------- */
function pieData() {
  const map = catMap();
  const sums = new Map();
  for (const e of S.entries) if (e.type === S.pieType && inPeriod(e)) sums.set(e.cat, (sums.get(e.cat) || 0) + e.amount);
  let rows = [...sums].map(([id, v]) => ({ cat: catFor(map, id), v, ids: [id] })).sort((a, b) => b.v - a.v);
  if (rows.length > 8) {
    const rest = rows.slice(7);
    rows = rows.slice(0, 7).concat([{ cat: { id: '_rest', name: `Weitere (${rest.length})`, slot: -1 }, v: rest.reduce((s, r) => s + r.v, 0), ids: rest.map(r => r.cat.id) }]);
  }
  const total = rows.reduce((s, r) => s + r.v, 0);
  return { rows, total };
}

function barData() {
  const p = S.period;
  const buckets = [];
  const mk = (y, m) => { const [from, to] = monthRange(y, m); return { from, to, label: MON_SHORT[m], short: MON_SHORT[m].charAt(0), long: `${MONTHS[m]} ${y}` }; };
  if (p.kind === 'month') {
    for (let k = 5; k >= 0; k--) { const [y, m] = mAdd(p.y, p.m, -k); buckets.push(mk(y, m)); }
  } else if (p.kind === 'year') {
    for (let m = 0; m < 12; m++) buckets.push(mk(p.y, m));
  } else {
    const years = S.entries.map(e => +e.date.slice(0, 4));
    const y0 = years.length ? Math.min(...years) : now.getFullYear();
    const y1 = years.length ? Math.max(...years) : now.getFullYear();
    for (let y = Math.max(y0, y1 - 11); y <= y1; y++) buckets.push({ from: `${y}-01-01`, to: `${y + 1}-01-01`, label: String(y), short: "'" + String(y).slice(2), long: String(y) });
  }
  buckets.forEach(b => { b.i = 0; b.o = 0; });
  for (const e of S.entries) {
    const b = buckets.find(x => e.date >= x.from && e.date < x.to);
    if (!b) continue;
    if (e.type === 'in') b.i += e.amount; else b.o += e.amount;
  }
  return buckets;
}

function arcPath(cx, cy, R, r, a0, a1) {
  const large = a1 - a0 > Math.PI ? 1 : 0;
  const pt = (rad, a) => [cx + rad * Math.sin(a), cy - rad * Math.cos(a)];
  const [x0, y0] = pt(R, a0), [x1, y1] = pt(R, a1), [x2, y2] = pt(r, a1), [x3, y3] = pt(r, a0);
  return `M${x0.toFixed(2)},${y0.toFixed(2)}A${R},${R} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)}L${x2.toFixed(2)},${y2.toFixed(2)}A${r},${r} 0 ${large} 0 ${x3.toFixed(2)},${y3.toFixed(2)}Z`;
}

function mountCharts() {
  const donut = $('#donut');
  if (donut) {

function niceStep(max, n) {
  const raw = max / n; const mag = 10 ** Math.floor(Math.log10(raw)); const f = raw / mag;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
}
function barPath(x, y, w, h, rad) {
  if (h <= 0) return '';
  const r = Math.min(rad, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function drawBars(host, data) {
  const W = Math.max(260, host.clientWidth || 320), H = 210;
  const m = { l: 54, r: 6, t: 10, b: 24 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const maxE = Math.max(...data.map(d => Math.max(d.i, d.o))) / 100;
  if (maxE <= 0) {
    host.innerHTML = `<div class="empty" style="padding:24px 8px"><p>In diesem Zeitraum gibt es noch keine Buchungen.</p></div>`;
    return;
  }
  const step = niceStep(maxE, 4);
  const top = Math.ceil(maxE / step) * step;
  const y = v => m.t + ph - (v / top) * ph;
  const gw = pw / data.length;
  const bw = Math.max(4, Math.min(20, gw * 0.32));
  let svg = '';
  for (let v = 0; v <= top + 1e-9; v += step) {
    const yy = y(v).toFixed(1);
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="${v === 0 ? 'var(--muted)' : 'var(--line)'}" stroke-width="1"/>`;
    svg += `<text x="${m.l - 8}" y="${yy}" text-anchor="end" dominant-baseline="middle">${intFmt.format(v)} €</text>`;
  }
  data.forEach((d, i) => {
    const cx = m.l + gw * i + gw / 2;
    const hi = (d.i / 100 / top) * ph, ho = (d.o / 100 / top) * ph;
    svg += `<path d="${barPath(cx - bw - 1, m.t + ph - hi, bw, hi, 4)}" fill="var(--in)"/>`;
    svg += `<path d="${barPath(cx + 1, m.t + ph - ho, bw, ho, 4)}" fill="var(--out)"/>`;
    svg += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(gw >= 30 ? d.label : d.short)}</text>`;
    svg += `<rect data-bar="${i}" x="${m.l + gw * i}" y="${m.t}" width="${gw}" height="${ph + m.b}" fill="transparent" style="cursor:pointer"/>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Säulendiagramm Einnahmen und Ausgaben">${svg}</svg>`;
  const tip = document.createElement('div');
  tip.className = 'tip'; tip.hidden = true; host.appendChild(tip);
  let cur = -1;
  const show = i => {
    if (i === cur) return; cur = i;
    if (i < 0) { tip.hidden = true; return; }
    const d = data[i], s = d.i - d.o;
    tip.innerHTML = `<b>${esc(d.long)}</b><span><em style="font-style:normal">Einnahmen</em>${money(d.i)}</span><span><em style="font-style:normal">Ausgaben</em>${money(d.o)}</span><span><em style="font-style:normal">Differenz</em>${signed(s)}</span>`;
    tip.hidden = false;
    const scale = host.clientWidth / W;
    const cx = (m.l + gw * i + gw / 2) * scale;
    const topBar = y(Math.max(d.i, d.o) / 100) * scale;
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(cx, tw / 2), host.clientWidth - tw / 2) + 'px';
    tip.style.top = Math.max(topBar - 6, tip.offsetHeight) + 'px';
  };
  $$('[data-bar]', host).forEach(r => {
    r.addEventListener('pointerenter', ev => { if (ev.pointerType === 'mouse') show(+r.dataset.bar); });
    r.addEventListener('click', () => show(cur === +r.dataset.bar ? -1 : +r.dataset.bar));
  });
  host.querySelector('svg').addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') show(-1); });
}

/* ---------- Krankenkasse: Beihilfe, PKV und Beitragsrückerstattung ---------- */
// beihilfe  = percent of each bill the Beihilfe pays; the private health insurance (PKV) pays the rest.
// threshold = the PKV's Beitragsrückerstattung in cents: paid only if no bill is submitted to the PKV in the calendar year.
// Submitting to the PKV pays off once the PKV share of the year's bills is higher than that refund.
const healthSettings = () => {
  const h = S.settings.health || {};
  return { beihilfe: typeof h.beihilfe === 'number' ? h.beihilfe : null, threshold: Number.isInteger(h.threshold) ? h.threshold : 0 };
};
const pkvShare = (amount, bp) => Math.round(amount * (100 - bp) / 100);
const pctStr = v => String(Math.round(v * 100) / 100).replace('.', ',') + ' %';
function healthEntries(y) {
  return S.entries.filter(e => e.health && e.type === 'out' && e.date.startsWith(y + '-'))
    .sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
}
function healthRow(e, map, bp) {
  const c = catFor(map, e.cat), share = bp === null ? null : pkvShare(e.amount, bp);

  </button>`;
}

  }

  const total = list.reduce((s, e) => s + e.amount, 0);

function backupPayload() {

    periodStart: periodStart(),

    entries: S.entries.map(({ id, type, amount, cat, date, party, note, tax, health, created, rule }) => ({ id, type, amount, cat, date, party: party || '', note: note || '', tax: !!tax, health: !!health, created: created || 0, ...(rule ? { rule } : {}) })),

}
async function offerFile(filename, data, label) {
  if (!window.claude) {
    try {
      const type = filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/json';
      const file = new File([data], filename, { type });
      if (/iPhone|iPad/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: filename }); return true; }
        catch (err) { if (err && err.name === 'AbortError') { toast('Speichern abgebrochen.'); return false; } }
      }
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return true;
    } catch {}
  }
  const dl = store.downloads;
  if (dl) {
    try { await dl.save({ filename, data }); return true; }
    catch (err) {
      if (err && err.code === 'declined') { toast('Speichern abgebrochen.'); return false; }
      if (err && err.code === 'rate_limited') { toast('Bitte einen Moment warten und erneut tippen.'); return false; }
    }
  }
  const text = typeof data === 'string' ? data : '';
  openSheet(`<div class="sheet-head"><h2>${esc(label)}</h2><button class="icon-btn" data-close aria-label="Schließen">✕</button></div>
    <p class="muted small">Das direkte Speichern ist hier nicht verfügbar. Kopiere den Inhalt und speichere ihn als Datei <b>${esc(filename)}</b>.</p>
    <textarea id="copyArea" readonly>${esc(text)}</textarea>
    <button class="btn primary" id="copyBtn">In Zwischenablage kopieren</button>`);
  $('#copyBtn').addEventListener('click', () => {
    const ta = $('#copyArea');
    navigator.clipboard.writeText(ta.value).then(() => toast('Kopiert.'), () => { ta.focus(); ta.select(); toast('Text markiert, bitte manuell kopieren.'); });
  });
  return true;
}
async function exportJson() {
  const enc = !!($('#bkEnc') && $('#bkEnc').checked);
  let text = JSON.stringify(backupPayload(), null, 2), name = `haushaltsbuch-backup-${todayISO()}.json`;
  if (enc) {
    const pw = $('#bkPw1').value, err = $('#bkPwErr2');
    const fail = m => { err.textContent = m; err.hidden = false; $('#bkPw1').focus(); };
    if (pw.length < 8) return fail('Das Passwort braucht mindestens 8 Zeichen.');
    if (pw !== $('#bkPw2').value) return fail('Die beiden Passwörter stimmen nicht überein.');
    err.hidden = true;
    try { text = await encryptBackup(text, pw); } catch { return fail('Die Verschlüsselung ist in diesem Browser fehlgeschlagen.'); }
    name = `haushaltsbuch-backup-${todayISO()}-verschluesselt.json`;
  }
  const ok = await offerFile(name, text, 'Backup-Datei');
  if (ok) { store.putSettings({ lastBackup: new Date().toISOString() }); toast(enc ? 'Verschlüsseltes Backup erstellt.' : 'Backup erstellt.'); }
}
async function exportCsv() {
  const map = catMap();
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const lines = ['Datum;Art;Empfänger/Zahler;Kategorie;Betrag;Notiz;Werbungskosten'];
  [...S.entries].sort((a, b) => a.date.localeCompare(b.date)).forEach(e => {
    const [y, m, d] = e.date.split('-');
    const amt = ((e.type === 'out' ? -1 : 1) * e.amount / 100).toFixed(2).replace('.', ',');
    lines.push([`${d}.${m}.${y}`, e.type === 'in' ? 'Einnahme' : 'Ausgabe', q(e.party), q(catFor(map, e.cat).name), amt, q(e.note), e.tax ? 'ja' : ''].join(';'));
  });
  await offerFile(`haushaltsbuch-${todayISO()}.csv`, '﻿' + lines.join('\r\n'), 'CSV-Export');
}

function validEntry(e) {
  return e && typeof e.id === 'string' && /^[A-Za-z0-9_.~:@+-]{1,120}$/.test(e.id) && e.id !== '.' && e.id !== '..'
    && (e.type === 'in' || e.type === 'out') && Number.isInteger(e.amount) && e.amount > 0
    && typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && typeof e.cat === 'string';
}
function validRule(r) {
  return r && typeof r.id === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(r.id) && (r.type === 'in' || r.type === 'out')
    && Number.isInteger(r.amount) && r.amount > 0 && [1, 3, 12].includes(r.every) && Number.isInteger(r.day) && r.day >= 1 && r.day <= 31
    && /^\d{4}-\d{2}$/.test(r.start) && (!r.end || /^\d{4}-\d{2}$/.test(r.end)) && (!r.last || /^\d{4}-\d{2}$/.test(r.last)) && typeof r.cat === 'string';
}
function startRestore(file) {
  if (file.size > 20e6) { toast('Die Datei ist zu groß für ein Backup (mehr als 20 MB).', true); return; }
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch { toast('Die Datei ist keine gültige Backup-Datei.', true); return; }
    if (data && data.app === 'haushaltsbuch' && data.enc) {
      if (!cryptoOk()) { toast('Verschlüsselte Backups lassen sich in diesem Browser nicht öffnen.', true); return; }
      askBackupPassword(data); return;
    }
    reviewBackup(data);
  };
  reader.onerror = () => toast('Die Datei konnte nicht gelesen werden.', true);
  reader.readAsText(file);
}
function reviewBackup(data) {
  {
    if (!data || data.app !== 'haushaltsbuch' || !Array.isArray(data.entries)) { toast('Diese Datei stammt nicht aus dem Haushaltsbuch.', true); return; }
    if (data.entries.length > 20000) { toast('Das Backup enthält zu viele Buchungen (mehr als 20.000).', true); return; }
    const entries = data.entries.filter(validEntry);
    // only known fields are taken over, as clean copies
    const bcats = (Array.isArray(data.categories) ? data.categories : []).slice(0, 500)
      .filter(c => c && typeof c.id === 'string' && typeof c.name === 'string' && (c.type === 'in' || c.type === 'out'))
      .map(c => ({ id: c.id.slice(0, 60), name: c.name.slice(0, 40), type: c.type, slot: Number.isInteger(c.slot) && c.slot >= -1 && c.slot < 100 ? c.slot : 0, ...(c.locked ? { locked: true } : {}) }));
    const brules = (Array.isArray(data.recurring) ? data.recurring : []).slice(0, 500).filter(validRule)
      .map(r => ({ id: r.id, type: r.type, amount: r.amount, cat: r.cat.slice(0, 60), party: String(r.party || '').slice(0, 120), note: String(r.note || '').slice(0, 200), tax: !!r.tax && r.type === 'out', every: r.every, day: r.day, start: r.start, end: r.end || null, last: r.last || '' }));
    const skipped = data.entries.length - entries.length;
    const when = data.exportedAt ? new Date(data.exportedAt).toLocaleString('de-DE', { dateStyle: 'long', timeStyle: 'short' }) : 'unbekannt';
    openSheet(`<div class="sheet-head"><h2>Backup einlesen</h2><button class="icon-btn" data-close aria-label="Schließen">✕</button></div>
      <p>Backup vom <b>${esc(when)}</b> mit <b class="num">${entries.length}</b> Buchungen, <b class="num">${bcats.length}</b> Kategorien und <b class="num">${brules.length}</b> wiederkehrenden Buchungen.${skipped ? ` <span class="muted">${skipped} fehlerhafte Einträge werden übersprungen.</span>` : ''}</p>
      <p class="muted small"><b>Ergänzen</b> behält deine aktuellen Buchungen und fügt die aus dem Backup hinzu. <b>Ersetzen</b> löscht alle aktuellen Buchungen (${S.entries.length}) und übernimmt genau den Stand des Backups.</p>
      <div class="progress" id="rsProg" hidden><i></i></div>
      <p class="small muted" id="rsMsg" hidden></p>
      <div class="actions"><button class="btn secondary" id="rsMerge">Ergänzen</button><button class="btn danger" id="rsReplace">Ersetzen</button></div>`);
    $('#rsMerge').addEventListener('click', () => runRestore(entries, bcats, brules, false, data.keywords, data.periodStart, data.health));
    $('#rsReplace').addEventListener('click', ev => {
      const b = ev.currentTarget;
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Wirklich ersetzen?'; return; }
      runRestore(entries, bcats, brules, true, data.keywords, data.periodStart, data.health);
    });
  }
}
async function runRestore(entries, bcats, brules, replace, bkw, bps, bhealth) {
  if (store.mode === 'db' && !navigator.onLine) { toast('Zum Einlesen eines Backups brauchst du eine Internetverbindung.', true); return; }
  $$('#sheet .actions button, #sheet [data-close]').forEach(b => b.disabled = true);
  const prog = $('#rsProg'), msg = $('#rsMsg');
  prog.hidden = false; msg.hidden = false; msg.textContent = 'Wird eingelesen …';
  // categories: replace → backup's set; merge → union by id
  let newCats;
  if (replace && bcats.length) newCats = bcats;
  else { const m = new Map(cats().map(c => [c.id, c])); bcats.forEach(c => { if (!m.has(c.id)) m.set(c.id, c); }); newCats = [...m.values()]; }
  for (const t of ['out', 'in']) if (!newCats.some(c => c.id === FALLBACK[t])) newCats.push(DEFAULT_CATS.find(c => c.id === FALLBACK[t]));
  const known = new Set(newCats.map(c => c.id));
  const clean = entries.map(e => ({ id: e.id, type: e.type, amount: e.amount, cat: known.has(e.cat) ? e.cat : FALLBACK[e.type], date: e.date, party: String(e.party || '').slice(0, 120), note: String(e.note || '').slice(0, 200), tax: !!e.tax && e.type === 'out', health: !!e.health && e.type === 'out', created: +e.created || Date.now(), ...(typeof e.rule === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(e.rule) ? { rule: e.rule } : {}) }));
  let newRules;
  if (replace) newRules = brules;
  else { const rm = new Map(rules().map(r => [r.id, r])); brules.forEach(r => { if (!rm.has(r.id)) rm.set(r.id, r); }); newRules = [...rm.values()]; }
  newRules = newRules.map(r => ({ ...r, cat: known.has(r.cat) ? r.cat : FALLBACK[r.type] }));
  const keep = new Set(clean.map(e => e.id));
  try {
    const patch = { categories: newCats, recurring: newRules };
    if (bhealth && typeof bhealth === 'object') patch.health = { beihilfe: Math.min(100, Math.max(0, Number(bhealth.beihilfe) || 0)), threshold: Math.max(0, Math.round(Number(bhealth.threshold) || 0)) };
    if (Number.isInteger(bps) && bps >= 1 && bps <= 31) patch.periodStart = bps;
    if (Array.isArray(bkw) && bkw.length) {
      const valid = bkw.slice(0, 5000).filter(k => k && typeof k.w === 'string' && k.w.trim() && typeof k.cat === 'string').map(k => ({ w: k.w.trim().slice(0, 40), cat: k.cat }));
      if (replace) patch.keywords = valid;
      else { const seen = new Set(keywords().map(k => k.w.toLowerCase() + '|' + k.cat)); patch.keywords = keywords().concat(valid.filter(k => !seen.has(k.w.toLowerCase() + '|' + k.cat))); }
    }
    await store.putSettings(patch);
    if (store.mode === 'db') {
      if (replace) { outbox = []; saveOutbox(); }
      const tasks = [];
      if (replace) S.entries.filter(e => !keep.has(e.id)).forEach(e => tasks.push(() => store.entriesCol.doc(e.id).delete()));
      clean.forEach(e => { const { id, ...body } = e; tasks.push(() => store.entriesCol.doc(id).set(body)); });
      await bulk(tasks, (d, n) => { prog.firstElementChild.style.width = (d / n * 100) + '%'; msg.textContent = `${d} von ${n} Änderungen gespeichert …`; });
    } else {
      const map = new Map(replace ? [] : S.entries.map(e => [e.id, e]));
      clean.forEach(e => map.set(e.id, e));
      S.entries = [...map.values()];
      saveLocal();
      prog.firstElementChild.style.width = '100%';
    }
    closeSheet();
    toast(`${clean.length} ${clean.length === 1 ? "Buchung" : "Buchungen"} eingelesen.`);
    render();
    setTimeout(bookDue, 2500);
  } catch (err) {
    msg.textContent = 'Abgebrochen: ' + errText(err) + ' Bereits eingelesene Buchungen bleiben erhalten; du kannst das Backup erneut einlesen.';
    $$('#sheet [data-close]').forEach(b => b.disabled = false);
  }
}

/* ---------- Encryption (Web Crypto; keys and passwords never leave the device) ---------- */
const BACKUP_ITER = 600000, PIN_ITER = 200000;
const cryptoOk = () => !!(window.crypto && crypto.subtle && crypto.getRandomValues);
function b64e(buf) { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }

const pbkdf2Base = secret => crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey', 'deriveBits']);
async function aesKey(pw, salt, iter) {
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, await pbkdf2Base(pw), { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function pinHash(pin, salt, iter) {
  return b64e(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, await pbkdf2Base(pin), 256));
}
async function encryptBackup(text, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aesKey(pw, salt, BACKUP_ITER), new TextEncoder().encode(text));

}

/* ---------- App lock (PIN) ----------
   Hides the app on this device until the PIN is entered. It is a screen lock: the stored data itself is not encrypted. */
function getLock() { try { const l = JSON.parse(localStorage.getItem(LOCAL_KEY + '.lock') || 'null'); return l && l.hash && l.salt ? l : null; } catch { return null; } }
function saveLock(l) { if (l) localStorage.setItem(LOCAL_KEY + '.lock', JSON.stringify(l)); else localStorage.removeItem(LOCAL_KEY + '.lock'); }
const lockWait = l => Math.max(0, Math.ceil((((l && l.until) || 0) - Date.now()) / 1000));
function lockView() {
  const w = lockWait(getLock());
  return `<section class="card lock-card">
    <h2>Haushaltsbuch ist gesperrt</h2>
    <p class="muted small" style="margin:0">Gib deine PIN ein, um deine Buchungen zu sehen.</p>
    <form id="lockForm" class="stack" novalidate>
      <input id="lockPin" class="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">
      <p class="err" id="lockErr" ${w ? '' : 'hidden'}>${w ? `Zu viele Fehlversuche. Bitte ${w} Sekunden warten.` : ''}</p>
      <button class="btn primary" type="submit">Entsperren</button>
    </form>
    <button class="add-link" type="button" id="lockForgot">PIN vergessen?</button>
  </section>`;
}
async function tryUnlock(pin) {
  const l = getLock(), err = $('#lockErr');
  if (!l) { S.locked = false; render(); return; }
  const w = lockWait(l);
  if (w) { err.textContent = `Zu viele Fehlversuche. Bitte ${w} Sekunden warten.`; err.hidden = false; return; }
  if (await pinHash(pin, b64d(l.salt), l.iter) === l.hash) {
    l.fails = 0; l.until = 0; try { saveLock(l); } catch {}
    S.locked = false; render(); return;
  }
  l.fails = (l.fails || 0) + 1;
  if (l.fails >= 5) l.until = Date.now() + 30000 * 2 ** Math.min(l.fails - 5, 6);
  try { saveLock(l); } catch {}
  err.textContent = l.fails >= 5 ? `Falsche PIN. Zu viele Fehlversuche, bitte ${lockWait(l)} Sekunden warten.` : `Falsche PIN (${l.fails} von 5 Versuchen).`;
  err.hidden = false; const i = $('#lockPin'); i.value = ''; i.focus();
}
function lockCard() {
  if (!cryptoOk()) return '';
  const l = getLock();
  return `<section class="card">

async function setLock() {

function openCat(id, newType) {
  const existing = id ? cats().find(c => c.id === id) : null;
  const type = existing ? existing.type : newType;
  const sameType = cats().filter(c => c.type === type);
  let slot = existing ? existing.slot : (() => {
    const use = Array(8).fill(0); sameType.forEach(c => { if (c.slot >= 0) use[c.slot % 8]++; });
    return use.indexOf(Math.min(...use));
  })();
  const used = existing ? S.entries.filter(e => e.cat === existing.id).length : 0;
  openSheet(`<div class="sheet-head"><h2>${existing ? 'Kategorie bearbeiten' : 'Neue Kategorie'}</h2><button class="icon-btn" data-close aria-label="Schließen">✕</button></div>

  const form = $('#catForm');

    ev.preventDefault();

    const err = $('#catErr');
    if (!name) { err.textContent = 'Bitte einen Namen eingeben.'; err.hidden = false; return; }
    if (sameType.some(c => c.id !== (existing && existing.id) && c.name.toLowerCase() === name.toLowerCase())) { err.textContent = 'Diese Kategorie gibt es schon.'; err.hidden = false; return; }
    slot = +form.slot.value;
    const list = cats().map(c => ({ ...c }));
    if (existing) Object.assign(list.find(c => c.id === existing.id), { name, slot });
    else list.push({ id: 'k-' + newId().slice(0, 12), name, type, slot });
    await store.putSettings({ categories: list });
    closeSheet(); toast('Kategorie gespeichert.');
  });
  const del = $('#catDel');
  if (del) del.addEventListener('click', async () => {
    if (!del.dataset.armed) { del.dataset.armed = '1'; del.textContent = 'Wirklich löschen?'; return; }
    del.disabled = true;

    const affected = S.entries.filter(e => e.cat === existing.id);

      for (const e of affected) await store.putEntry({ ...e, cat: target });
      await store.putSettings({
        categories: cats().filter(c => c.id !== existing.id),
        recurring: rules().map(r => r.cat === existing.id ? { ...r, cat: target } : r),
      });
      closeSheet(); toast('Kategorie gelöscht.');
    } catch (er) { del.disabled = false; toast('Nicht gelöscht: ' + errText(er), true); }
  });
}

/* ---------- Keyword rules ---------- */
function addKeyword(word, cat) {
  const w = String(word || '').trim().toLowerCase().slice(0, 40);
  if (!w) return null;
  return keywords().filter(k => k.w.toLowerCase() !== w).concat({ w, cat });
}
async function applyKeywordsToFallback() {
  const hits = [];
  for (const e of S.entries) {
    if (e.cat !== FALLBACK[e.type]) continue;
    const m = matchKeyword((e.party || '') + ' ' + (e.note || ''), e.type);
    if (m) hits.push({ ...e, cat: m.cat });
  }
  try { for (const e of hits) await store.putEntry(e); toast(`${hits.length} ${hits.length === 1 ? 'Buchung' : 'Buchungen'} zugeordnet.`); }
  catch (err) { toast('Nicht alle zugeordnet: ' + errText(err), true); }
}

// Marks rows that look like bookings which already exist. Every existing booking can be matched only once, so two real
// identical bookings on one day are not both swallowed by a single stored one.
//   dup 'exact': same day, amount and similar recipient.  dup 'near': same amount and recipient within 5 days
//   (a pending booking later shows up with its booking date).
function markDuplicates(rows) {
  const key = x => String(x || '').toLowerCase().replace(/[^a-zäöüß0-9]/g, '').slice(0, 4);
  const day = iso => Date.parse(iso + 'T12:00:00Z') / 86400000;
  const pool = S.entries.map(e => ({ e, used: false, k: key(e.party) }));
  const sameKind = (x, r) => !x.used && x.e.type === r.type && x.e.amount === r.amount;
  for (const r of rows) {
    const k = key(r.party);
    const hit = pool.find(x => sameKind(x, r) && x.e.date === r.date && (!x.k || !k || x.k === k));
    if (hit) { hit.used = true; r.dup = 'exact'; }
  }
  for (const r of rows) {
    if (r.dup) continue;
    const k = key(r.party); if (!k) continue;
    const hits = pool.filter(x => sameKind(x, r) && x.k === k && Math.abs(day(x.e.date) - day(r.date)) <= 5)
      .sort((a, b) => Math.abs(day(a.e.date) - day(r.date)) - Math.abs(day(b.e.date) - day(r.date)));
    if (hits[0]) { hits[0].used = true; r.dup = 'near'; r.dupDate = hits[0].e.date; }
  }
  // identical rows inside the pasted list itself: possible (two real purchases) but worth a look
  const seen = new Map();
  for (const r of rows) { const id = [r.date, r.type, r.amount, key(r.party)].join('|'); seen.set(id, (seen.get(id) || 0) + 1); r._id = id; }
  for (const r of rows) { r.multi = seen.get(r._id) > 1; delete r._id; }
}
function normalizeImport(res) {
  const list = (Array.isArray(res) ? res : (res && Array.isArray(res.transactions) ? res.transactions : [])).slice(0, 1000);
  const today = todayISO(), out = [];
  for (const r of list) {
    if (!r || typeof r !== 'object') continue;
    const date = String(r.date || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(new Date(date))) continue;
    const a = typeof r.amount === 'number' ? r.amount : parseFloat(String(r.amount || '').replace(/\./g, '').replace(',', '.').replace('−', '-'));
    if (!isFinite(a) || a === 0) continue;
    const type = a < 0 ? 'out' : 'in';
    const party = String(r.party || '').trim().slice(0, 80);
    const purpose = String(r.purpose || '').trim().slice(0, 120);
    const amount = Math.round(Math.abs(a) * 100);
    const kw = matchKeyword(party + ' ' + purpose + ' ' + String(r.hint || ''), type);
    const ai = cats().find(c => c.id === r.category && c.type === type);
    const cat = kw ? kw.cat : ai ? ai.id : FALLBACK[type];
    out.push({ date: date > today ? today : date, type, amount, party, purpose, cat, sugg: cat, kw: kw ? kw.w : '', dup: '', dupDate: '', multi: false });
  }
  markDuplicates(out);
  return out.sort((x, z) => z.date.localeCompare(x.date));
}

        ${r.party ? `<label data-remember hidden><input type="checkbox" data-f="remember" checked>„${esc(r.party)}“ künftig so zuordnen</label>` : ''}</div>
    </div>`).join('')}</div>
    <p class="err" id="impErr" hidden></p>
    <div class="actions sticky"><button class="btn secondary" type="button" data-close>Abbrechen</button><button class="btn primary" type="button" id="impSave"></button></div>`);
  const list = $('#sheet .imp-list');
  const count = () => { const n = $$('[data-f="on"]:checked', list).length; $('#impSave').textContent = n ? `${n} übernehmen` : 'Nichts ausgewählt'; $('#impSave').disabled = !n; };
  const allBtn = $('#impAll');
  const syncAll = () => { allBtn.textContent = $$('[data-f="on"]', list).every(b => b.checked) ? 'Alle abwählen' : 'Alle auswählen'; };
  allBtn.addEventListener('click', () => {
    const boxes = $$('[data-f="on"]', list), target = !boxes.every(b => b.checked);
    boxes.forEach(b => { b.checked = target; b.closest('.imp').classList.toggle('off', !target); });
    count(); syncAll();
  });
  count(); syncAll();
  list.addEventListener('change', ev => {

    const r = rows[+row.dataset.i];
    if (ev.target.dataset.f === 'on') { row.classList.toggle('off', !ev.target.checked); count(); syncAll(); }
    if (ev.target.dataset.f === 'amount') {
      const raw = ev.target.value.trim();
      const neg = /^[-−]/.test(raw), cents = parseAmount(raw.replace(/^[-−+]/, ''));
      if (cents > 0) {
        r.amount = cents;
        const t = neg ? 'out' : 'in';
        if (t !== r.type) {
          r.type = t; r.cat = firstCat(t, matchKeyword(r.party + ' ' + r.purpose, t)?.cat || FALLBACK[t]); r.sugg = r.cat; row.querySelector('[data-f="cat"]').innerHTML = opts(t, r.cat);
          const hw = row.querySelector('[data-out-only]'); hw.hidden = t !== 'out'; if (t !== 'out') { r.health = false; r.tax = false; hw.querySelectorAll('input').forEach(i => { i.checked = false; }); }

  $('#impSave').addEventListener('click', async () => {
